name: Fast-Track Auto-Merge & Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-and-merge:
    name: Verify Quality Gates and Auto-Merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Merge Pull Request Directly to Main
        run: |
          echo "Quality gates passed successfully (0 errors). Merging PR #${{ github.event.pull_request.number }}..."
          gh pr merge "${{ github.event.pull_request.html_url }}" --squash --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
